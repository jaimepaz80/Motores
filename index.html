<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo - Camaronera Majagual</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <nav class="tabs-nav">
        <a href="index.html">Pestaña Motores</a>
        <a href="admin.html">Pestaña Administración</a>
        <a href="reportes.html">Reporte de Horas</a>
    </nav>

    <h1>Camaronera Majagual</h1>
    <h2>Estatus de Motores en Tiempo Real</h2>

    <div class="stations-container">
        <div class="station-module">
            <h2>Módulo A</h2>
            <div id="moduleA-grid" class="motor-grid"></div>
        </div>
        <div class="station-module">
            <h2>Módulo B</h2>
            <div id="moduleB-grid" class="motor-grid"></div>
        </div>
        <div class="station-module">
            <h2>Rebombeo</h2>
            <div id="moduleC-grid" class="motor-grid"></div>
        </div>
        <div class="station-module">
            <h2>San Ramón</h2>
            <div id="moduleD-grid" class="motor-grid"></div>
        </div>
    </div>

    <!-- Modal de Alerta (Oculto por defecto) -->
    <div id="alertModal" class="modal-overlay" style="display: none;">
        <div id="alertBox" class="modal-content">
            <h2 id="alertTitle">CAMBIO DE ESTATUS</h2>
            <div id="alertDetails" class="alert-details"></div>
            <button id="alertCloseBtn">Cerrar</button>
        </div>
    </div>

    <script type="module" src="viewer.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
